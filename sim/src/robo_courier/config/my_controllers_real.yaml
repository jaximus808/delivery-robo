ack_cont:
  ros__parameters:
    reference_timeout: 2.0
    front_steering: true
    open_loop: false
    velocity_rolling_window_size: 10
    position_feedback: true  # You'll want feedback for better control
    
    # Single virtual joints
    rear_wheels_names: ["rear_axle_joint"]  # Virtual center rear wheel
    front_wheels_names: ["front_steer_joint"]  # Virtual center steering
    
    # Geometry
    front_wheel_track: 0.36322
    rear_wheel_track: 0.36322
    wheelbase: 0.49784
    front_wheels_radius: 0.076
    rear_wheels_radius: 0.076
    
    # Publishing
    use_stamped_vel: true
    enable_odom_tf: true
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    odom_only_twist: false
    publish_rate: 50.0


#     What the controller will expect from your hardware interface:
# Command Interfaces:

# rear_axle_joint/velocity - linear velocity for rear wheels
# front_steer_joint/position - steering angle (radians)

# State Interfaces:

# rear_axle_joint/velocity - current rear wheel velocity feedback
# rear_axle_joint/position - current rear wheel position (for odometry)
# front_steer_joint/position - current steering angle feedback

# In your hardware interface code:
# You'll need to add virtual joints for these and handle the internal math:

# Convert rear_axle_joint velocity commands to your individual motor commands
# Convert steering angle commands to your actual steering mechanism
# Aggregate feedback from real wheels back to the virtual joints

# Does your robot have actual Ackermann steering geometry, or are you adapting a different drive system?