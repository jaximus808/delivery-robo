slam_toolbox:
  ros__parameters:
    # frames and topics
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: scan

    # general timing
    transform_publish_period: 0.02
    map_update_interval: 1.0

    # scan matcher and map tuning
    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.0174533
    resolution: 0.05
    max_laser_range: 12.0
    use_imu: false
    enable_interactive_mode: false
    mode: mapping
    throttle_scans: 1
    diagnostics_agg_rate: 1.0
    correlative_scan_matching: true
    csm_coarse_angle: 0.261799
    csm_coarse_lin: 0.5
    csm_fine_angle: 0.0349066
    csm_fine_lin: 0.1
    do_loop_closing: true
    loop_search_space: 10.0
    loop_search_space_smear: 0.1
    loop_match_min_chain_size: 10
    loop_match_max_variance_coarse: 3.0
    loop_match_max_variance_fine: 0.5
    enable_pose_smoothing: true
    slam_toolbox_pose_graph_file_name: ""
    ceres_solver_options.num_threads: 12
