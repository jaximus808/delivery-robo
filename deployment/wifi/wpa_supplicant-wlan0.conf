# WiFi config for the robot Pi (wlan0). Installed by deployment/wifi/install.sh
# to /etc/wpa_supplicant/wpa_supplicant-wlan0.conf.
#
# wpa_supplicant joins the highest-priority network in range and re-selects
# when networks come and go: hotspot > lab wifi (wurc5) > wustl guest.
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=0
country=US

# 1. Personal hotspot (preferred). Filled in by install.sh from HOTSPOT_SSID/PSK.
network={
    ssid="__HOTSPOT_SSID__"
    psk="__HOTSPOT_PSK__"
    priority=10
}

# 2. Lab wifi (what the Pi was on before this change).
network={
    ssid="wurc5"
    psk="robotics@washu"
    priority=5
}

# 3. Fallback: WashU guest (open network, captive portal -> no internet, LAN only).
network={
    ssid="wustl-guest-2.0"
    key_mgmt=NONE
    priority=1
}
